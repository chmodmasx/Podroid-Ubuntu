name: Build Ubuntu debug APK

on:
  push:
    branches:
      - ubuntu-26.04-rootfs
    paths:
      - '**'
  workflow_dispatch:

concurrency:
  group: ubuntu-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Make build scripts executable
        run: chmod +x gradlew build-all.sh init-podroid build-rootfs/build-rootfs.sh

      # Build the part we are actively changing first. If Ubuntu rootfs creation
      # fails, the job stops before spending time installing Java/Android SDK.
      - name: Build Ubuntu rootfs
        run: ./build-all.sh rootfs

      - name: Validate Ubuntu rootfs
        run: |
          set -euxo pipefail
          command -v unsquashfs >/dev/null || { sudo apt-get update; sudo apt-get install -y squashfs-tools; }
          ROOTFS=app/src/main/assets/alpine-rootfs.squashfs
          test -s "$ROOTFS"
          unsquashfs -cat "$ROOTFS" etc/os-release | grep -q '^ID=ubuntu$'
          unsquashfs -cat "$ROOTFS" etc/os-release | grep -q '^VERSION_ID="26.04"$'
          unsquashfs -cat "$ROOTFS" etc/podroid/rootfs-id | grep -q '^ubuntu-26.04$'
          ! unsquashfs -ll "$ROOTFS" | grep -q 'etc/alpine-release'
          unsquashfs -ll "$ROOTFS" | grep -q 'usr/local/bin/podroid-vsock-agent'
          unsquashfs -ll "$ROOTFS" | grep -q 'usr/local/bin/podroid-hostd'
          unsquashfs -ll "$ROOTFS" | grep -q 'usr/local/bin/podroid-overlay-normalize'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # setup-android@v3 still defaults to the retired legacy "tools"
          # package. Current Google repositories no longer publish it, so let
          # the action install its command-line tools plus platform-tools only.
          packages: platform-tools

      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Reuse unchanged upstream v1.2.8 VM binaries
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/podroid-upstream.apk \
            https://github.com/ExTV/Podroid/releases/download/v1.2.8/Podroid-v1.2.8-release.apk

          mkdir -p app/src/main/assets/qemu app/src/main/jniLibs/arm64-v8a /tmp/podroid-upstream

          unzip -p /tmp/podroid-upstream.apk assets/vmlinuz-virt > app/src/main/assets/vmlinuz-virt
          unzip -p /tmp/podroid-upstream.apk assets/initrd.img > app/src/main/assets/initrd.img

          unzip -q /tmp/podroid-upstream.apk 'assets/qemu/*' -d /tmp/podroid-upstream
          cp -a /tmp/podroid-upstream/assets/qemu/. app/src/main/assets/qemu/

          for lib in \
            libqemu-system-aarch64.so \
            libslirp.so \
            libpodroid-bridge.so \
            libpodroid-launcher.so; do
            unzip -p /tmp/podroid-upstream.apk "lib/arm64-v8a/$lib" \
              > "app/src/main/jniLibs/arm64-v8a/$lib"
          done

          test -s app/src/main/assets/vmlinuz-virt
          test -s app/src/main/assets/initrd.img
          test -s app/src/main/jniLibs/arm64-v8a/libqemu-system-aarch64.so

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Validate APK contents
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/alpine-rootfs.squashfs'
          unzip -l "$APK" | grep -q 'assets/vmlinuz-virt'
          unzip -l "$APK" | grep -q 'assets/initrd.img'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libqemu-system-aarch64.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libpodroid-bridge.so'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Podroid-Ubuntu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
