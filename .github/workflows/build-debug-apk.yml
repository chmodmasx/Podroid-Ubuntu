name: Build Ubuntu debug APK

on:
  push:
    branches:
      - ubuntu-26.04-rootfs
    paths:
      - '**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make build scripts executable
        run: chmod +x gradlew build-all.sh init-podroid

      - name: Build kernel and initramfs
        run: ./build-all.sh initramfs

      - name: Build Ubuntu rootfs
        run: ./build-all.sh rootfs

      - name: Build QEMU and Android native helpers
        run: ./build-all.sh qemu

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Validate APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/alpine-rootfs.squashfs'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libqemu-system-aarch64.so'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Podroid-Ubuntu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
