name: One-shot Ubuntu branding source fix

on:
  push:
    branches:
      - ubuntu-26.04-rootfs
    paths:
      - '.github/workflows/one-shot-ubuntu-branding.yml'

permissions:
  contents: write

jobs:
  fix-branding:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ubuntu-26.04-rootfs
          fetch-depth: 0

      - name: Replace stale Alpine label in source
        run: |
          set -euxo pipefail
          FILE='app/src/main/java/com/excp/podroid/ui/screens/settings/SettingsScreen.kt'
          grep -q 'Alpine 3.24' "$FILE"
          sed -i 's/Alpine 3\.24/Ubuntu 26.04 LTS/g' "$FILE"
          ! grep -q 'Alpine 3.24' "$FILE"
          grep -q 'Ubuntu 26.04 LTS' "$FILE"

      - name: Commit source correction
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/excp/podroid/ui/screens/settings/SettingsScreen.kt
          git commit -m 'fix: show Ubuntu 26.04 in settings'
          git push origin HEAD:ubuntu-26.04-rootfs
